name: Website

# Builds the website from the same code as the app and publishes it on GitHub Pages:
# https://<your-github-name>.github.io/<this-repo>/
on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GITHUB_REPO: ${{ github.repository }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the website address
        run: |
          # Set the repository variable SITE_BASE_URL (e.g. https://toyswap.com) after buying a domain.
          SITE="${{ vars.SITE_BASE_URL }}"
          if [ -z "$SITE" ]; then SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"; fi
          SITE="${SITE%/}"
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          echo "BASE_PATH=$(node -e "console.log(new URL(process.argv[1]).pathname.replace(/\/$/,''))" "$SITE")" >> "$GITHUB_ENV"

      - name: The app lives under /app/
        run: node -e "const f='app.json';const a=require('./'+f);a.expo.experiments={...(a.expo.experiments||{}),baseUrl:process.env.BASE_PATH+'/app'};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"

      - run: npx expo export --platform web --output-dir dist/app

      - name: Keep the logged-in app out of search results
        run: sed -i 's#<head>#<head><meta name="robots" content="noindex">#' dist/app/index.html

      - name: Public pages for Google and AI assistants (home, parents, safety, FAQ, sitemap, llms.txt)
        run: python3 site/build.py dist "$SITE" "https://github.com/${{ github.repository }}/releases/latest/download/ToySwap.apk"

      - name: Links into the app (like /app/parent) open the app
        run: cp dist/app/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
